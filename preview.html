<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>C Practice — обзор заданий</title>

    <style>
        :root {
            --bg:           #0c1019;
            --panel:        #141b29;
            --panel-hover:  #1b2536;
            --border:       #293348;
            --text:         #eef2ff;
            --muted:        #9eacc6;
            --accent:       #a998ff;
            --green:        #70ddb0;
            --yellow:       #ffd17b;
            --red:          #ff98aa;
            --radius:       16px;
            --nav-w:        300px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            height: 100vh;
            color: var(--text);
            background:
                    radial-gradient(ellipse at 10% 0%, #28204366, transparent 45%),
                    radial-gradient(ellipse at 100% 15%, #123f4666, transparent 40%),
                    var(--bg);
            font-family: system-ui, -apple-system, BlinkMacSystemFont,
            "Segoe UI", sans-serif;
            line-height: 1.55;
        }

        button, input { font: inherit; }
        a { color: var(--accent); }

        code, pre {
            font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
        }

        /* ============================================
           App layout: nav | content-area
           ============================================ */

        .app {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* ============================================
           Navigation sidebar
           ============================================ */

        .nav {
            width: var(--nav-w);
            min-width: 220px;
            max-width: 400px;
            border-right: 1px solid var(--border);
            background: var(--panel);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            flex-shrink: 0;
        }

        .nav-header {
            padding: 16px;
            border-bottom: 1px solid var(--border);
        }

        .nav-header h1 {
            font-size: 16px;
            letter-spacing: -.03em;
            margin-bottom: 10px;
        }

        .nav-btn {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 9px 12px;
            background: var(--panel-hover);
            color: var(--text);
            cursor: pointer;
            font-size: 13px;
            transition: background .15s;
        }

        .nav-btn:hover { background: #243044; }

        .nav-status {
            padding: 6px 16px;
            font-size: 11px;
            color: var(--muted);
            border-bottom: 1px solid var(--border);
        }

        .nav-status.error { color: var(--red); }

        .tree {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
            scrollbar-color: #4c5972 transparent;
        }

        /* ---- Tree items ---- */

        .tree-section { margin-bottom: 2px; }

        .tree-section-title {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 16px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .08em;
            color: var(--accent);
            cursor: pointer;
            user-select: none;
        }

        .tree-section-title:hover { background: #1b253622; }

        .tree-section-title::before {
            content: "▶";
            font-size: 8px;
            transition: transform .15s;
        }

        .tree-section.open > .tree-section-title::before {
            transform: rotate(90deg);
        }

        .tree-section-body { display: none; }
        .tree-section.open > .tree-section-body { display: block; }

        .tree-task {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 16px 6px 32px;
            font-size: 12px;
            color: var(--muted);
            cursor: pointer;
            user-select: none;
            transition: background .1s, color .1s;
        }

        .tree-task:hover {
            background: var(--panel-hover);
            color: var(--text);
        }

        .tree-task.active {
            background: #a998ff18;
            color: var(--accent);
        }

        .tree-task-icon { font-size: 13px; }

        .tree-badge {
            margin-left: auto;
            padding: 1px 5px;
            border: 1px solid #53466e;
            border-radius: 5px;
            color: #c6b8f5;
            font-size: 9px;
            text-transform: uppercase;
            flex-shrink: 0;
        }

        /* ============================================
           Content area
           ============================================ */

        .content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 0;
        }

        /* ---- Task toolbar ---- */

        .task-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            border-bottom: 1px solid var(--border);
            background: var(--panel);
            flex-wrap: wrap;
            min-height: 50px;
        }

        .task-bar-title {
            font-size: 14px;
            font-weight: 700;
            margin-right: auto;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .task-bar-btn {
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 6px 10px;
            background: var(--panel-hover);
            color: var(--muted);
            cursor: pointer;
            font-size: 12px;
            transition: background .1s, color .1s;
            white-space: nowrap;
        }

        .task-bar-btn:hover { background: #243044; color: var(--text); }
        .task-bar-btn.active { color: var(--accent); border-color: var(--accent); }
        .task-bar-btn:disabled { opacity: .35; cursor: not-allowed; }

        .task-bar-btn.reveal { color: var(--yellow); border-color: #6b5c30; }
        .task-bar-btn.reveal:hover { background: #2a2418; color: var(--yellow); }
        .task-bar-btn.reveal.active { border-color: var(--yellow); }

        .layout-toggle {
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 6px 10px;
            background: var(--panel-hover);
            color: var(--muted);
            cursor: pointer;
            font-size: 14px;
            transition: background .1s;
        }

        .layout-toggle:hover { background: #243044; color: var(--text); }

        /* ---- Split panels (Modern Card Layout) ---- */

        .panels {
            flex: 1;
            display: flex;
            gap: 16px;
            padding: 16px;
            overflow: hidden;
            min-height: 0;
            background: rgba(8, 11, 19, 0.4); /* Подложка под панелями */
        }

        .panels.vertical {
            flex-direction: column;
        }

        .panel {
            flex: 1;
            overflow-y: auto;
            padding: 24px 28px;
            scrollbar-color: #4c5972 transparent;
            min-height: 0;
            min-width: 0;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.7);
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
        }

        .panel:hover {
            border-color: #384663;
            box-shadow: 0 12px 40px -10px rgba(0, 0, 0, 0.85);
        }

        .panel-topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }

        .panel-label {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .06em;
            flex-shrink: 0;
        }

        .panel-label.primary {
            background: #a998ff22;
            color: var(--accent);
        }

        .panel-label.secondary {
            background: #ffd17b22;
            color: var(--yellow);
        }

        .zoom-group {
            display: flex;
            align-items: center;
            gap: 4px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--panel);
            overflow: hidden;
        }

        .zoom-btn {
            border: none;
            background: transparent;
            color: var(--muted);
            padding: 3px 8px;
            cursor: pointer;
            font-size: 12px;
            line-height: 1.4;
            transition: background .1s, color .1s;
        }

        .zoom-btn:hover {
            background: var(--panel-hover);
            color: var(--text);
        }

        .zoom-btn:active { background: #243044; }
        .zoom-btn.reset { font-size: 10px; letter-spacing: .02em; }
        .zoom-value {
            padding: 0 6px;
            font-size: 10px;
            color: var(--muted);
            min-width: 44px;
            text-align: center;
            border-left: 1px solid var(--border);
            border-right: 1px solid var(--border);
            user-select: none;
        }

        .panel-empty {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            color: var(--muted);
        }

        .panel-empty-icon {
            font-size: 36px;
            margin-bottom: 10px;
            color: var(--accent);
        }

        .panel-empty-text {
            max-width: 300px;
            font-size: 13px;
        }

        .content-wrap {
            max-width: 860px;
        }

        .breadcrumb {
            margin-bottom: 16px;
            font-size: 11px;
            color: var(--muted);
            font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
        }

        /* ============================================
           Rendered Markdown
           ============================================ */

        .document h1, .document h2, .document h3,
        .document h4, .document h5, .document h6 {
            margin: 22px 0 10px;
            font-size: 1.285em;
            line-height: 1.35;
            letter-spacing: -.02em;
        }

        .document h1:first-child, .document h2:first-child { margin-top: 0; }
        .document h3, .document h4, .document h5, .document h6 { font-size: 1.07em; }
        .document p { margin: 10px 0; }
        .document ul, .document ol { padding-left: 23px; }
        .document li { margin: 6px 0; }

        .document code {
            padding: 2px 5px;
            border-radius: 5px;
            background: #080d1680;
            color: #d4c7ff;
            font-size: .92em;
        }

        .document pre {
            padding: 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: auto;
            background: #0a101b;
            line-height: 1.6;
            white-space: pre;
        }

        .document pre code {
            padding: 0;
            background: transparent;
            color: #dfe8ff;
        }

        .document blockquote {
            margin: 14px 0;
            padding: 1px 14px;
            border-left: 3px solid var(--accent);
            color: #bbc5d9;
            background: #a998ff09;
        }

        .document details {
            margin: 14px 0;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: #141b29;
        }

        .document details summary {
            cursor: pointer;
            color: var(--accent);
            font-weight: 600;
        }

        .document details[open] summary { margin-bottom: 8px; }

        .table-wrap { overflow-x: auto; margin: 14px 0; }

        .document table {
            width: 100%;
            border-collapse: collapse;
            font-size: .93em;
        }

        .document th, .document td {
            border: 1px solid var(--border);
            padding: 9px;
            text-align: left;
            vertical-align: top;
        }

        .document th { background: #222c3e; }

        .document hr {
            border: 0;
            border-top: 1px solid var(--border);
            margin: 20px 0;
        }

        .document img { max-width: 100%; }

        .document a {
            color: var(--accent);
            text-decoration: underline;
            text-decoration-color: #a998ff44;
        }

        .document a:hover { text-decoration-color: var(--accent); }

        /* ============================================
           Responsive
           ============================================ */

        @media (max-width: 900px) {
            .app { flex-direction: column; }
            .nav {
                width: 100%; max-width: 100%; min-width: 0;
                max-height: 35vh;
                border-right: none;
                border-bottom: 1px solid var(--border);
            }
            .panels {
                flex-direction: column !important;
                padding: 12px;
                gap: 12px;
            }
            .panel { padding: 18px; }
        }
    </style>
</head>

<body>
<div class="app">

    <!-- ======== Navigation ======== -->
    <aside class="nav">
        <div class="nav-header">
            <h1>📚 Обзор заданий</h1>
            <button class="nav-btn" id="chooseBtn">Выбрать папку проекта</button>
        </div>
        <div id="navStatus" class="nav-status">
            Выбери корень проекта для загрузки.
        </div>
        <nav class="tree" id="tree"></nav>
    </aside>

    <!-- ======== Content area ======== -->
    <div class="content-area" id="contentArea">

        <!-- Task toolbar -->
        <div class="task-bar" id="taskBar">
            <span class="task-bar-title" id="taskBarTitle">Выбери задание слева</span>
            <div id="fileButtons"></div>
            <button class="layout-toggle" id="layoutToggle" title="Переключить раскладку">⬜</button>
        </div>

        <!-- Split panels -->
        <div class="panels" id="panels">
            <div class="panel" id="panelLeft">
                <div class="panel-empty">
                    <div>
                        <div class="panel-empty-icon">📋</div>
                        <div class="panel-empty-text">
                            Выбери задание в дереве слева.<br>
                            Условие появится здесь автоматически.
                        </div>
                    </div>
                </div>
            </div>
            <div class="panel" id="panelRight" style="display:none;">
                <div class="panel-empty">
                    <div>
                        <div class="panel-empty-icon">💡</div>
                        <div class="panel-empty-text">
                            Нажми на кнопку файла сверху,<br>
                            чтобы открыть теорию, решение или тесты.
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    "use strict";

    /* ================================================================
       CONFIG
       ================================================================ */

    var SECONDARY_FILES = [
        { name: "theory.md",            icon: "💡", label: "Теория",            reveal: true },
        { name: "tests.md",             icon: "🧪", label: "Тесты",             reveal: false },
        { name: "solution.c",           icon: "✅", label: "Решение",            reveal: true },
        { name: "solution_commented.c", icon: "💬", label: "С комментариями",   reveal: true }
    ];

    var SECTION_NAMES = {
        "01_basics":          "Основы C",
        "02_input_output":    "Ввод и вывод",
        "03_expressions":     "Выражения и вычисления",
        "04_loops":           "Циклы и последовательности",
        "05_dynamic_arrays":  "Динамические массивы",
        "06_strings":         "Строки и символы",
        "07_matrices":        "Матрицы",
        "08_structures":      "Структуры"
    };

    var ZOOM_MIN = 0.8;
    var ZOOM_MAX = 1.5;
    var ZOOM_STEP = 0.1;

    /* ================================================================
       DOM REFS
       ================================================================ */

    var chooseBtn    = document.getElementById("chooseBtn");
    var navStatus    = document.getElementById("navStatus");
    var treeEl       = document.getElementById("tree");
    var taskBarTitle = document.getElementById("taskBarTitle");
    var fileButtons  = document.getElementById("fileButtons");
    var layoutToggle = document.getElementById("layoutToggle");
    var panels       = document.getElementById("panels");
    var panelLeft    = document.getElementById("panelLeft");
    var panelRight   = document.getElementById("panelRight");

    /* ================================================================
       STATE
       ================================================================ */

    var activeTaskEl    = null;
    var activeTask      = null;
    var activeSecondary = null;
    var isVertical      = false;
    var zoomLeft        = 1.0;
    var zoomRight       = 1.0;

    /* ================================================================
       FILE SYSTEM
       ================================================================ */

    async function pickProject() {
        if (!window.isSecureContext || typeof window.showDirectoryPicker !== "function") {
            showNav("Нужен Chrome или Edge.", true);
            return;
        }

        var root;
        try {
            root = await window.showDirectoryPicker({ id: "c-practice-preview", mode: "read" });
        } catch (e) {
            if (e.name === "AbortError") return;
            throw e;
        }

        var tasksDir;
        try {
            tasksDir = await root.getDirectoryHandle("tasks");
        } catch (e) {
            showNav("В выбранной папке нет tasks.", true);
            return;
        }

        showNav("Читаю структуру…");
        var structure = await scanTasks(tasksDir);

        if (structure.length === 0) {
            showNav("Не найдено ни одного задания.", true);
            return;
        }

        var total = 0;
        for (var i = 0; i < structure.length; i++) total += structure[i].tasks.length;

        buildTree(structure);
        showNav("Загружено " + total + " заданий из " + structure.length + " разделов.");
    }

    async function scanTasks(tasksDir) {
        var sections = [];

        for await (var sEntry of tasksDir.values()) {
            if (sEntry.kind !== "directory") continue;

            var sDir  = sEntry;
            var tasks = [];

            for await (var tEntry of sDir.values()) {
                if (tEntry.kind !== "directory") continue;

                var tDir = tEntry;

                var hasReadme = false;
                try { await tDir.getFileHandle("README.md"); hasReadme = true; } catch (e) {}
                if (!hasReadme) continue;

                var available = [];
                for (var f = 0; f < SECONDARY_FILES.length; f++) {
                    try {
                        await tDir.getFileHandle(SECONDARY_FILES[f].name);
                        available.push(SECONDARY_FILES[f]);
                    } catch (e) {}
                }

                tasks.push({
                    name:       tEntry.name,
                    directory:  tDir,
                    section:    sEntry.name,
                    secondary:  available
                });
            }

            tasks.sort(function (a, b) { return a.name.localeCompare(b.name); });
            if (tasks.length > 0) {
                sections.push({ name: sDir.name, tasks: tasks });
            }
        }

        sections.sort(function (a, b) { return a.name.localeCompare(b.name); });
        return sections;
    }

    async function readFile(dir, name) {
        var h = await dir.getFileHandle(name);
        var f = await h.getFile();
        return await f.text();
    }

    /* ================================================================
       NAVIGATION TREE
       ================================================================ */

    function showNav(msg, isErr) {
        navStatus.textContent = msg;
        navStatus.className = "nav-status" + (isErr ? " error" : "");
    }

    function prettyName(dirName) {
        var n = dirName.replace(/^\d+_/, "");
        var extra = n.endsWith("_extra");
        if (extra) n = n.replace(/_extra$/, "");
        n = n.replace(/_/g, " ");
        n = n.charAt(0).toUpperCase() + n.slice(1);
        return { name: n, extra: extra };
    }

    function buildTree(sections) {
        treeEl.replaceChildren();

        for (var s = 0; s < sections.length; s++) {
            var sec = sections[s];

            var secEl    = document.createElement("div");
            secEl.className = "tree-section";

            var secTitle = document.createElement("div");
            secTitle.className = "tree-section-title";
            secTitle.textContent = SECTION_NAMES[sec.name] || sec.name;
            secTitle.addEventListener("click", (function (el) {
                return function () { el.classList.toggle("open"); };
            })(secEl));

            var secBody = document.createElement("div");
            secBody.className = "tree-section-body";

            for (var t = 0; t < sec.tasks.length; t++) {
                var task = sec.tasks[t];
                var info = prettyName(task.name);

                var taskEl = document.createElement("div");
                taskEl.className = "tree-task";

                var icon = document.createElement("span");
                icon.className = "tree-task-icon";
                icon.textContent = "📄";

                var nameSpan = document.createElement("span");
                nameSpan.textContent = info.name;

                taskEl.append(icon, nameSpan);

                if (info.extra) {
                    var badge = document.createElement("span");
                    badge.className = "tree-badge";
                    badge.textContent = "extra";
                    taskEl.appendChild(badge);
                }

                taskEl.addEventListener("click", (function (taskData, el) {
                    return function () { selectTask(taskData, el); };
                })(task, taskEl));

                secBody.appendChild(taskEl);
            }

            secEl.append(secTitle, secBody);
            treeEl.appendChild(secEl);
        }

        var first = treeEl.querySelector(".tree-section");
        if (first) first.classList.add("open");
    }

    /* ================================================================
       TASK SELECTION
       ================================================================ */

    async function selectTask(task, el) {
        if (activeTaskEl) activeTaskEl.classList.remove("active");
        el.classList.add("active");
        activeTaskEl = el;
        activeTask   = task;

        var info = prettyName(task.name);
        taskBarTitle.textContent = info.name + (info.extra ? " (extra)" : "");

        buildFileButtons(task);
        await loadPanel(panelLeft, task.directory, "README.md", task.section, task.name, "primary", "📋 Условие", "left");

        activeSecondary = null;
        clearSecondaryButtons();
        panelRight.style.display = 'none';
    }

    function buildFileButtons(task) {
        fileButtons.replaceChildren();

        for (var i = 0; i < task.secondary.length; i++) {
            var conf = task.secondary[i];

            var btn = document.createElement("button");
            btn.className = "task-bar-btn" + (conf.reveal ? " reveal" : "");
            btn.textContent = conf.icon + " " + conf.label;

            btn.addEventListener("click", (function (c, b) {
                return function () { openSecondary(c, b); };
            })(conf, btn));

            fileButtons.appendChild(btn);
        }
    }

    function clearSecondaryButtons() {
        var btns = fileButtons.querySelectorAll(".task-bar-btn");
        for (var i = 0; i < btns.length; i++) {
            btns[i].classList.remove("active");
        }
    }

    async function openSecondary(conf, btn) {
        if (!activeTask) return;

        if (activeSecondary === conf.name) {
            clearSecondaryButtons();
            activeSecondary = null;
            panelRight.style.display = 'none';
            return;
        }

        clearSecondaryButtons();
        btn.classList.add("active");
        activeSecondary = conf.name;

        panelRight.style.display = '';

        await loadPanel(
            panelRight,
            activeTask.directory,
            conf.name,
            activeTask.section,
            activeTask.name,
            "secondary",
            conf.icon + " " + conf.label,
            "right"
        );
    }

    /* ================================================================
       PANEL RENDERING
       ================================================================ */

    async function loadPanel(panel, dir, filename, sectionName, taskName, labelClass, labelText, side) {
        var content;

        try {
            content = await readFile(dir, filename);
        } catch (e) {
            panel.replaceChildren();
            var err = document.createElement("p");
            err.style.color = "var(--red)";
            err.textContent = "Не удалось прочитать: " + e.message;
            panel.appendChild(err);
            return;
        }

        panel.replaceChildren();

        var topbar = document.createElement("div");
        topbar.className = "panel-topbar";

        var label = document.createElement("span");
        label.className = "panel-label " + labelClass;
        label.textContent = labelText;
        topbar.appendChild(label);

        topbar.appendChild(createZoomGroup(side));

        panel.appendChild(topbar);

        var bc = document.createElement("div");
        bc.className = "breadcrumb";
        bc.textContent = "tasks/" + sectionName + "/" + taskName + "/" + filename;
        panel.appendChild(bc);

        var wrap = document.createElement("div");
        wrap.className = "content-wrap document";

        if (side === "left") {
            wrap.style.fontSize = (14 * zoomLeft).toFixed(2) + "px";
        } else {
            wrap.style.fontSize = (14 * zoomRight).toFixed(2) + "px";
        }

        var isMd = filename.endsWith(".md");

        if (isMd) {
            wrap.appendChild(renderMarkdown(content));
        } else {
            var pre  = document.createElement("pre");
            var code = document.createElement("code");
            code.textContent = content;
            pre.appendChild(code);
            wrap.appendChild(pre);
        }

        panel.appendChild(wrap);
        panel.scrollTop = 0;
    }

    function createZoomGroup(side) {
        var group = document.createElement("div");
        group.className = "zoom-group";

        var zoomOut = document.createElement("button");
        zoomOut.className = "zoom-btn";
        zoomOut.textContent = "−";
        zoomOut.title = "Уменьшить текст";

        var zoomVal = document.createElement("div");
        zoomVal.className = "zoom-value";
        zoomVal.textContent = Math.round((side === "left" ? zoomLeft : zoomRight) * 100) + "%";

        var zoomReset = document.createElement("button");
        zoomReset.className = "zoom-btn reset";
        zoomReset.textContent = "100%";
        zoomReset.title = "Сбросить масштаб";

        var zoomIn = document.createElement("button");
        zoomIn.className = "zoom-btn";
        zoomIn.textContent = "+";
        zoomIn.title = "Увеличить текст";

        zoomOut.addEventListener("click", function (e) {
            e.stopPropagation();
            if (side === "left") {
                zoomLeft = Math.max(ZOOM_MIN, +(zoomLeft - ZOOM_STEP).toFixed(2));
                applyZoom(panelLeft, zoomLeft, "left");
            } else {
                zoomRight = Math.max(ZOOM_MIN, +(zoomRight - ZOOM_STEP).toFixed(2));
                applyZoom(panelRight, zoomRight, "right");
            }
            zoomVal.textContent = Math.round((side === "left" ? zoomLeft : zoomRight) * 100) + "%";
        });

        zoomReset.addEventListener("click", function (e) {
            e.stopPropagation();
            if (side === "left") {
                zoomLeft = 1.0;
                applyZoom(panelLeft, zoomLeft, "left");
            } else {
                zoomRight = 1.0;
                applyZoom(panelRight, zoomRight, "right");
            }
            zoomVal.textContent = "100%";
        });

        zoomIn.addEventListener("click", function (e) {
            e.stopPropagation();
            if (side === "left") {
                zoomLeft = Math.min(ZOOM_MAX, +(zoomLeft + ZOOM_STEP).toFixed(2));
                applyZoom(panelLeft, zoomLeft, "left");
            } else {
                zoomRight = Math.min(ZOOM_MAX, +(zoomRight + ZOOM_STEP).toFixed(2));
                applyZoom(panelRight, zoomRight, "right");
            }
            zoomVal.textContent = Math.round((side === "left" ? zoomLeft : zoomRight) * 100) + "%";
        });

        group.append(zoomOut, zoomVal, zoomReset, zoomIn);
        return group;
    }

    function applyZoom(panel, z, side) {
        var wrap = panel.querySelector(".content-wrap.document");
        if (wrap) {
            wrap.style.fontSize = (14 * z).toFixed(2) + "px";
        }
        var val = panel.querySelector(".zoom-value");
        if (val) {
            val.textContent = Math.round(z * 100) + "%";
        }
    }

    function showPanelEmpty(panel, icon, text) {
        panel.replaceChildren();
        var outer = document.createElement("div");
        outer.className = "panel-empty";
        var inner = document.createElement("div");
        var ic    = document.createElement("div");
        ic.className = "panel-empty-icon";
        ic.textContent = icon;
        var tx = document.createElement("div");
        tx.className = "panel-empty-text";
        tx.textContent = text;
        inner.append(ic, tx);
        outer.appendChild(inner);
        panel.appendChild(outer);
    }

    /* ================================================================
       LAYOUT TOGGLE
       ================================================================ */

    layoutToggle.addEventListener("click", function () {
        isVertical = !isVertical;
        panels.classList.toggle("vertical", isVertical);
        layoutToggle.textContent = isVertical ? "⬛" : "⬜";
        layoutToggle.title = isVertical
            ? "Переключить на горизонтальную раскладку"
            : "Переключить на вертикальную раскладку";
    });

    /* ================================================================
       MARKDOWN RENDERER
       ================================================================ */

    function element(tag, cls, text) {
        var n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text !== undefined) n.textContent = text;
        return n;
    }

    function appendInline(parent, text) {
        var pat = /(`[^`\n]+`|\*\*[^*\n]+\*\*|\*[^*\n]+\*|\[[^\]]*\]\([^)]*\))/g;
        var pos = 0, m;
        while ((m = pat.exec(text)) !== null) {
            if (m.index > pos) parent.appendChild(document.createTextNode(text.slice(pos, m.index)));
            var tok = m[0];
            if (tok.startsWith("`")) {
                parent.appendChild(element("code", "", tok.slice(1, -1)));
            } else if (tok.startsWith("**")) {
                var s = element("strong"); appendInline(s, tok.slice(2, -2)); parent.appendChild(s);
            } else if (tok.startsWith("*")) {
                var e = element("em"); appendInline(e, tok.slice(1, -1)); parent.appendChild(e);
            } else if (tok.startsWith("[")) {
                var lm = tok.match(/^\[([^\]]*)\]\(([^)]*)\)$/);
                if (lm) {
                    var a = element("a"); a.href = lm[2]; a.target = "_blank"; a.rel = "noopener noreferrer";
                    appendInline(a, lm[1]); parent.appendChild(a);
                } else parent.appendChild(document.createTextNode(tok));
            }
            pos = pat.lastIndex;
        }
        if (pos < text.length) parent.appendChild(document.createTextNode(text.slice(pos)));
    }

    function appendCellWithBreaks(parent, text) {
        var parts = text.split(/<br\s*\/?>/i);
        for (var i = 0; i < parts.length; i++) {
            if (i > 0) parent.appendChild(document.createElement("br"));
            appendInline(parent, parts[i]);
        }
    }

    function tableCells(line) {
        var v = line.trim().replace(/\\\|/g, "\u0001");
        if (v.startsWith("|")) v = v.slice(1);
        if (v.endsWith("|"))   v = v.slice(0, -1);
        return v.split("|").map(function (c) { return c.trim().replace(/\u0001/g, "|"); });
    }

    function isTableDivider(line) {
        if (!line || !line.includes("|")) return false;
        var c = tableCells(line);
        return c.length > 0 && c.every(function (x) { return /^:?-{3,}:?$/.test(x); });
    }

    function isBlockStart(lines, idx) {
        if (idx >= lines.length) return true;
        var l = lines[idx];
        return /^\s*$/.test(l) || /^\s*(`{3,}|~{3,})/.test(l)
            || /^#{1,6}\s+/.test(l) || /^\s*>/.test(l)
            || /^\s*[-+*]\s+/.test(l) || /^\s*\d+[.)]\s+/.test(l)
            || /^\s*([-*_])(?:\s*\1){2,}\s*$/.test(l)
            || /^\s*<details/i.test(l) || /^\s*<\/details/i.test(l)
            || (l.includes("|") && isTableDivider(lines[idx + 1]));
    }

    function renderMarkdown(md) {
        var frag = document.createDocumentFragment();
        var lines = md.replace(/\r\n?/g, "\n").split("\n");
        var i = 0;

        while (i < lines.length) {
            var line = lines[i];
            if (!line.trim()) { i++; continue; }

            var fence = line.match(/^\s*(`{3,}|~{3,})(.*)$/);
            if (fence) {
                var mk = fence[1], cl = []; i++;
                while (i < lines.length) {
                    var ct = lines[i].trim();
                    if (ct.length >= mk.length && Array.from(ct).every(function (c) { return c === mk[0]; })) { i++; break; }
                    cl.push(lines[i]); i++;
                }
                var pre = element("pre"); pre.appendChild(element("code", "", cl.join("\n")));
                frag.appendChild(pre); continue;
            }

            var hd = line.match(/^(#{1,6})\s+(.*)$/);
            if (hd) { var h = element("h" + hd[1].length); appendInline(h, hd[2]); frag.appendChild(h); i++; continue; }

            if (/^\s*<details/i.test(line)) {
                var det = document.createElement("details");
                var sm = line.match(/<summary>(.*?)<\/summary>/i);
                if (!sm) { i++; if (i < lines.length) { sm = lines[i].match(/<summary>(.*?)<\/summary>/i); if (sm) i++; } }
                if (sm) { var sn = document.createElement("summary"); appendInline(sn, sm[1]); det.appendChild(sn); }
                var dc = [];
                while (i < lines.length && !/^\s*<\/details/i.test(lines[i])) { dc.push(lines[i]); i++; }
                if (i < lines.length) i++;
                if (dc.length) det.appendChild(renderMarkdown(dc.join("\n")));
                frag.appendChild(det); continue;
            }

            if (line.includes("|") && isTableDivider(lines[i + 1])) {
                var wrap = element("div", "table-wrap");
                var tbl = element("table"), thd = element("thead"), hr = element("tr");
                var hc = tableCells(line);
                for (var hi = 0; hi < hc.length; hi++) { var th = element("th"); appendCellWithBreaks(th, hc[hi]); hr.appendChild(th); }
                thd.appendChild(hr); tbl.appendChild(thd); i += 2;
                var tb = element("tbody");
                while (i < lines.length && lines[i].trim() && lines[i].includes("|")) {
                    var dr = element("tr"), dc2 = tableCells(lines[i]);
                    for (var di = 0; di < dc2.length; di++) { var td = element("td"); if (dc2[di]) appendCellWithBreaks(td, dc2[di]); dr.appendChild(td); }
                    tb.appendChild(dr); i++;
                }
                tbl.appendChild(tb); wrap.appendChild(tbl); frag.appendChild(wrap); continue;
            }

            if (/^\s*>/.test(line)) {
                var ql = [];
                while (i < lines.length && /^\s*>/.test(lines[i])) { ql.push(lines[i].replace(/^\s*>\s?/, "")); i++; }
                var bq = element("blockquote"); bq.appendChild(renderMarkdown(ql.join("\n"))); frag.appendChild(bq); continue;
            }

            if (/^\s*([-*_])(?:\s*\1){2,}\s*$/.test(line)) { frag.appendChild(element("hr")); i++; continue; }

            var uo = /^\s*[-+*]\s+/.test(line), od = /^\s*\d+[.)]\s+/.test(line);
            if (uo || od) {
                var list = element(od ? "ol" : "ul");
                var ip = od ? /^\s*\d+[.)]\s+(.*)$/ : /^\s*[-+*]\s+(.*)$/;
                while (i < lines.length) {
                    var im = lines[i].match(ip); if (!im) break;
                    var lt = [im[1]]; i++;
                    while (i < lines.length && lines[i].trim() && !ip.test(lines[i]) && !isBlockStart(lines, i)) { lt.push(lines[i].trim()); i++; }
                    var li = element("li"); appendInline(li, lt.join(" ")); list.appendChild(li);
                }
                frag.appendChild(list); continue;
            }

            var pl = [line]; i++;
            while (i < lines.length && !isBlockStart(lines, i)) { pl.push(lines[i]); i++; }
            var p = element("p"); appendInline(p, pl.join("\n")); frag.appendChild(p);
        }

        return frag;
    }

    /* ================================================================
       INIT
       ================================================================ */

    chooseBtn.addEventListener("click", function () {
        pickProject().catch(function (e) {
            console.error(e);
            showNav("Ошибка: " + e.message, true);
        });
    });

    if (!window.isSecureContext || typeof window.showDirectoryPicker !== "function") {
        showNav("Нужен Chrome или Edge с доступом к файлам.", true);
    }
</script>
