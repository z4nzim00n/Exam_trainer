<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>C Practice — тесты по теории</title>
    <style>
        /* ===================== THEMES ===================== */
        :root[data-theme="dark"]{
            --bg:#0c1019; --bg2:#0a0e16; --panel:#141b29; --panel2:#1b2536;
            --border:#293348; --text:#eef2ff; --muted:#9eacc6; --accent:#a998ff;
            --green:#70ddb0; --yellow:#ffd17b; --red:#ff98aa;
            --glow1:#28204366; --glow2:#123f4666;
            --opt-bg:#10172399; --code-bg:#080d1680; --shadow:0 12px 40px #00000030;
        }
        :root[data-theme="light"]{
            --bg:#f4f6fb; --bg2:#eaeef7; --panel:#ffffff; --panel2:#f0f3fa;
            --border:#d8dfeb; --text:#1a2233; --muted:#64748b; --accent:#7c5cff;
            --green:#12a97a; --yellow:#c47f0a; --red:#dc3d5c;
            --glow1:#7c5cff14; --glow2:#12a97a14;
            --opt-bg:#f8fafcdd; --code-bg:#eef2f9; --shadow:0 8px 28px #0f172a14;
        }

        *{box-sizing:border-box;margin:0;padding:0}
        html{scroll-behavior:smooth}
        body{
            min-height:100vh;color:var(--text);
            background:radial-gradient(ellipse at 10% 0%,var(--glow1),transparent 45%),
            radial-gradient(ellipse at 100% 12%,var(--glow2),transparent 42%),var(--bg);
            font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.55;
            transition:background .35s,color .25s;
        }
        button{font:inherit;cursor:pointer;border:1px solid var(--border);border-radius:12px;
            background:var(--panel);color:var(--text);transition:.16s}
        button:hover:not(:disabled){background:var(--panel2);transform:translateY(-1px)}
        button:disabled{cursor:default}
        button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
        code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
            background:var(--code-bg);padding:2px 6px;border-radius:5px;font-size:.9em;color:var(--accent)}

        .wrap{width:min(920px,100%);margin:0 auto;padding:36px 20px 80px}

        /* ===================== THEME TOGGLE ===================== */
        .theme-btn{
            position:fixed;top:18px;right:18px;z-index:50;
            width:46px;height:46px;border-radius:14px;font-size:20px;
            display:grid;place-items:center;backdrop-filter:blur(10px);
            box-shadow:var(--shadow);
        }

        /* ===================== HERO ===================== */
        .hero{text-align:center;margin-bottom:38px}
        .eyebrow{color:var(--accent);text-transform:uppercase;letter-spacing:.18em;
            font-size:11px;font-weight:800;margin-bottom:10px}
        .hero h1{font-size:clamp(28px,5vw,44px);letter-spacing:-.04em;line-height:1.1}
        .hero p{color:var(--muted);margin-top:13px;max-width:560px;margin-inline:auto;font-size:15px}

        /* ===================== TOPIC GRID ===================== */
        .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
        .topic{padding:20px;border-radius:18px;background:var(--panel);text-align:left;
            box-shadow:var(--shadow);position:relative}
        .topic:hover{border-color:var(--accent);transform:translateY(-3px)}
        .t-icon{font-size:26px;display:block;margin-bottom:10px}
        .t-name{font-size:16px;font-weight:700;letter-spacing:-.02em;margin-bottom:4px}
        .t-count{color:var(--muted);font-size:12.5px}
        .t-note{margin-top:9px;padding:4px 8px;border-radius:7px;font-size:10.5px;
            background:color-mix(in srgb,var(--yellow) 14%,transparent);color:var(--yellow);display:inline-block}
        .topic.special{border-color:color-mix(in srgb,var(--yellow) 40%,var(--border))}

        /* ===================== RANDOM PANEL ===================== */
        .rnd{margin-top:26px;padding:22px;border:1px solid var(--border);border-radius:18px;
            background:var(--panel);box-shadow:var(--shadow)}
        .rnd h2{font-size:17px;margin-bottom:5px}
        .rnd .sub{color:var(--muted);font-size:13px;margin-bottom:16px}
        .rnd-row{display:flex;flex-wrap:wrap;gap:13px;align-items:center}
        .cnt{display:flex;align-items:center;gap:9px}
        .cnt input{width:76px;padding:9px;border:1px solid var(--border);border-radius:10px;
            background:var(--bg2);color:var(--text);font:inherit;text-align:center}
        .chk{display:flex;align-items:center;gap:8px;color:var(--muted);cursor:pointer;font-size:14px}
        .chk input{width:17px;height:17px;accent-color:var(--accent);cursor:pointer}
        .primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700;padding:11px 20px}
        :root[data-theme="dark"] .primary{color:#171224}
        .primary:hover:not(:disabled){filter:brightness(1.12)}

        /* ===================== QUIZ HEADER ===================== */
        .qhead{position:sticky;top:0;z-index:30;padding:14px 0 12px;margin-bottom:20px;
            background:linear-gradient(to bottom,var(--bg) 70%,transparent);
            backdrop-filter:blur(6px)}
        .qbar{display:flex;align-items:center;gap:11px;flex-wrap:wrap;margin-bottom:11px}
        .qbar .back{padding:7px 13px;font-size:13px}
        .qbar .title{font-weight:700;font-size:15.5px;margin-right:auto}
        .pill{padding:5px 11px;border-radius:20px;font-size:12.5px;font-weight:700}
        .pill.ok{background:color-mix(in srgb,var(--green) 15%,transparent);color:var(--green)}
        .pill.bad{background:color-mix(in srgb,var(--red) 15%,transparent);color:var(--red)}
        .prog{height:5px;background:var(--panel2);border-radius:4px;overflow:hidden}
        .prog-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--green));
            border-radius:4px;transition:width .4s cubic-bezier(.4,0,.2,1)}

        /* ===================== QUESTION CARDS ===================== */
        .stack{display:flex;flex-direction:column;gap:18px}
        .card{padding:24px;border:1px solid var(--border);border-radius:18px;
            background:var(--panel);box-shadow:var(--shadow);
            animation:slideIn .45s cubic-bezier(.2,.8,.3,1)}
        @keyframes slideIn{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
        .card.done{opacity:.92}
        .card.done:hover{opacity:1}

        .q-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:9px}
        .q-num{color:var(--accent);font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
        .tag{padding:3px 9px;border-radius:7px;font-size:10.5px;font-weight:600}
        .tag.multi{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
        .tag.src{background:color-mix(in srgb,var(--yellow) 14%,transparent);color:var(--yellow)}
        .tag.topic{background:var(--panel2);color:var(--muted)}
        .q-text{font-size:18.5px;font-weight:650;letter-spacing:-.02em;line-height:1.38;margin-bottom:16px}

        .opts{display:flex;flex-direction:column;gap:9px}
        .opt{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;text-align:left;
            border-radius:13px;background:var(--opt-bg);width:100%}
        .opt:hover:not(:disabled){border-color:var(--accent)}
        .opt:disabled{transform:none}
        .okey{flex-shrink:0;width:25px;height:25px;border-radius:8px;background:var(--panel2);
            display:grid;place-items:center;font-size:11.5px;font-weight:800;color:var(--muted)}
        .otext{flex:1;font-size:14.5px}
        .omark{flex-shrink:0;font-size:17px;font-weight:800;opacity:0;transition:.2s}

        .opt.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,transparent)}
        .opt.sel .okey{background:var(--accent);color:#fff}
        :root[data-theme="dark"] .opt.sel .okey{color:#171224}
        .opt.right{border-color:var(--green);background:color-mix(in srgb,var(--green) 10%,transparent)}
        .opt.right .okey{background:var(--green);color:#fff}
        .opt.right .omark{opacity:1;color:var(--green)}
        .opt.bad{border-color:var(--red);background:color-mix(in srgb,var(--red) 10%,transparent)}
        .opt.bad .okey{background:var(--red);color:#fff}
        .opt.bad .omark{opacity:1;color:var(--red)}
        .opt.miss{border-color:var(--yellow);background:color-mix(in srgb,var(--yellow) 9%,transparent)}
        .opt.miss .omark{opacity:1;color:var(--yellow)}

        /* ===================== EXPLANATION ===================== */
        .exp{margin-top:17px;border-radius:14px;overflow:hidden;
            animation:expand .4s cubic-bezier(.2,.8,.3,1)}
        @keyframes expand{from{opacity:0;max-height:0}to{opacity:1;max-height:500px}}
        .exp-head{padding:11px 16px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px}
        .exp.ok .exp-head{background:color-mix(in srgb,var(--green) 13%,transparent);color:var(--green)}
        .exp.no .exp-head{background:color-mix(in srgb,var(--red) 13%,transparent);color:var(--red)}
        .exp-body{padding:14px 16px;background:var(--opt-bg);font-size:14px;line-height:1.6}
        .exp-right{margin-bottom:9px;padding-bottom:9px;border-bottom:1px solid var(--border)}
        .exp-right b{color:var(--green)}
        .exp-why{color:var(--muted)}
        .exp-why b{color:var(--text);font-weight:650}

        .next-wrap{margin-top:16px}
        .next-btn{padding:11px 22px}

        /* ===================== RESULTS ===================== */
        .res{text-align:center;padding:40px 26px;border:1px solid var(--border);border-radius:20px;
            background:var(--panel);box-shadow:var(--shadow);animation:slideIn .5s}
        .res-emo{font-size:58px;margin-bottom:12px}
        .res h2{font-size:26px;letter-spacing:-.03em;margin-bottom:7px}
        .res .grade{color:var(--muted);margin-bottom:26px;font-size:15px}
        .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:420px;margin:0 auto 26px}
        .stat{padding:16px 10px;border:1px solid var(--border);border-radius:14px;background:var(--opt-bg)}
        .sval{font-size:26px;font-weight:800;letter-spacing:-.03em}
        .slbl{color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;margin-top:2px}
        .stat.g .sval{color:var(--green)} .stat.r .sval{color:var(--red)} .stat.a .sval{color:var(--accent)}
        .res-act{display:flex;gap:11px;justify-content:center;flex-wrap:wrap}

        .hidden{display:none!important}

        @media(max-width:600px){
            .wrap{padding:24px 14px 60px}
            .card{padding:18px}
            .q-text{font-size:16.5px}
            .stats{grid-template-columns:1fr;max-width:230px}
            .theme-btn{width:42px;height:42px;top:12px;right:12px}
        }
    </style>
</head>
<body>

<button class="theme-btn" id="themeBtn" title="Сменить тему">🌙</button>

<div class="wrap">

    <!-- ========== MENU ========== -->
    <section id="menu">
        <div class="hero">
            <div class="eyebrow">C Practice / theory quiz</div>
            <h1>Тесты по теории</h1>
            <p>Выбери тему или собери случайный набор. После каждого ответа — подробный разбор,
                почему правильный вариант именно такой.</p>
        </div>
        <div class="grid" id="topicGrid"></div>
        <div class="rnd">
            <h2>🎲 Случайный набор</h2>
            <div class="sub">Вопросы берутся понемногу из каждой выбранной темы.</div>
            <div class="rnd-row">
                <div class="cnt">
                    <span style="color:var(--muted);font-size:14px">Вопросов:</span>
                    <input type="number" id="rndCount" value="20" min="5" max="150">
                </div>
                <label class="chk"><input type="checkbox" id="rndWidum" checked> Включить вопросы с widum.ru/s21/</label>
                <button class="primary" id="rndStart">Начать</button>
            </div>
        </div>
    </section>

    <!-- ========== QUIZ ========== -->
    <section id="quiz" class="hidden">
        <div class="qhead">
            <div class="qbar">
                <button class="back" id="quitBtn">← Выйти</button>
                <span class="title" id="quizTitle"></span>
                <span class="pill ok" id="pillOk">✓ 0</span>
                <span class="pill bad" id="pillBad">✗ 0</span>
            </div>
            <div class="prog"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
        </div>
        <div class="stack" id="stack"></div>
    </section>

    <!-- ========== RESULTS ========== -->
    <section id="results" class="hidden">
        <div class="res">
            <div class="res-emo" id="resEmo">🎉</div>
            <h2 id="resTitle"></h2>
            <div class="grade" id="resGrade"></div>
            <div class="stats">
                <div class="stat g"><div class="sval" id="sOk">0</div><div class="slbl">Верно</div></div>
                <div class="stat r"><div class="sval" id="sBad">0</div><div class="slbl">Ошибок</div></div>
                <div class="stat a"><div class="sval" id="sPct">0%</div><div class="slbl">Результат</div></div>
            </div>
            <div class="res-act">
                <button class="primary" id="retryBtn">Пройти заново</button>
                <button id="reviewBtn">Посмотреть разбор</button>
                <button id="menuBtn">К списку тем</button>
            </div>
        </div>
    </section>

</div>

<script>
    "use strict";

    /* ============================================================
       БАНК ВОПРОСОВ
       q — вопрос, a — варианты, correct — индексы верных, exp — разбор
       ============================================================ */
    const BANK = {

        basics:{icon:"🔤",name:"Основы C",q:[
                {q:"Какой тип используется для хранения целых чисел?",a:["float","int","char*","double"],correct:[1],
                    exp:"<b>int</b> — базовый целочисленный тип, обычно 4 байта. <code>float</code> и <code>double</code> хранят вещественные числа, а <code>char*</code> — это указатель на символ."},
                {q:"Что произойдёт при делении 7 / 2, если оба операнда типа int?",a:["Результат 3.5","Результат 3","Ошибка компиляции","Результат 4"],correct:[1],
                    exp:"Если оба операнда целые, выполняется <b>целочисленное деление</b> — дробная часть просто отбрасывается, без округления. Чтобы получить 3.5, нужно привести хотя бы один операнд: <code>7.0 / 2</code> или <code>(double)7 / 2</code>."},
                {q:"Какие объявления переменных корректны?",a:["int a = 5;","int a, b = 10;","int a = 5, int b = 10;","int: a = 5;"],correct:[0,1],
                    exp:"Тип пишется <b>один раз</b> в начале объявления. Вариант C повторяет <code>int</code> после запятой — это синтаксическая ошибка. В варианте D двоеточие после типа недопустимо."},
                {q:"Что делает ключевое слово void в int main(void)?",a:["Функция ничего не возвращает","Функция не принимает аргументов","Функция пустая","Отключает проверку типов"],correct:[1],
                    exp:"<code>void</code> в <b>скобках</b> означает отсутствие параметров. Возвращаемый тип здесь <code>int</code> — он стоит перед именем функции. Если написать <code>main()</code> без <code>void</code>, компилятор не будет проверять аргументы."},
                {q:"Какие утверждения о типе char верны?",a:["Занимает 1 байт","Может хранить только буквы","Хранит код символа","Может участвовать в арифметике"],correct:[0,2,3],
                    exp:"<code>char</code> — это <b>целочисленный тип</b> размером 1 байт. Он хранит числовой код символа (например, 65 для 'A'), поэтому с ним можно делать арифметику: <code>'a' + 1</code> даст 'b'."},
                {q:"Что вернёт sizeof(int) на большинстве современных систем?",a:["2","4","8","Зависит от значения переменной"],correct:[1],
                    exp:"На типичных 32- и 64-битных платформах <code>int</code> занимает <b>4 байта</b>. Стандарт гарантирует минимум 2 байта, но реальный размер зависит от компилятора. <code>sizeof</code> считает размер <i>типа</i>, а не значения."},
                {q:"Какой результат даст выражение 5 % 3?",a:["1","2","1.66","0"],correct:[1],
                    exp:"Оператор <code>%</code> возвращает <b>остаток от деления</b>. 5 делится на 3 один раз, остаток = 5 − 3 = 2. Для вещественных чисел <code>%</code> не работает — там нужна функция <code>fmod</code>."},
                {q:"Почему нельзя использовать неинициализированную переменную?",a:["Компилятор не даст скомпилировать","В ней лежит мусор — неопределённое поведение","Она всегда равна нулю","Это замедляет программу"],correct:[1],
                    exp:"Локальные переменные <b>не обнуляются автоматически</b>. В памяти остаётся то, что было там раньше. Программа скомпилируется (максимум с предупреждением), но результат будет непредсказуемым."},
                {q:"Что такое неявное приведение типов?",a:["Компилятор сам преобразует тип при необходимости","Программист пишет (int)x","Это ошибка компиляции","Тип меняется во время выполнения"],correct:[0],
                    exp:"При смешивании типов компилятор <b>автоматически</b> приводит операнды к общему типу. Например, в <code>int + double</code> целое станет вещественным. Явное приведение — это когда программист сам пишет <code>(int)x</code>."},
                {q:"Какое значение получит y после int x = 5; double y = x / 2;?",a:["2.5","2.0","2","Ошибка"],correct:[1],
                    exp:"Деление <code>x / 2</code> происходит <b>до</b> присваивания, и оба операнда целые — получается 2. Только потом двойка превращается в <code>2.0</code>. Чтобы получить 2.5, нужно <code>(double)x / 2</code>."},
                {q:"Какие модификаторы применимы к int?",a:["short","long","unsigned","signed"],correct:[0,1,2,3],
                    exp:"Все четыре допустимы. <code>short</code> и <code>long</code> меняют <b>размер</b>, <code>signed</code> и <code>unsigned</code> — наличие <b>знака</b>. Их можно комбинировать: <code>unsigned long int</code>."},
                {q:"Что означает const перед типом переменной?",a:["Переменная хранится в постоянной памяти","Значение нельзя изменить после инициализации","Переменная глобальная","Переменная быстрее работает"],correct:[1],
                    exp:"<code>const</code> — это <b>обещание компилятору</b>, что значение не будет меняться. Попытка присвоить новое значение вызовет ошибку компиляции. На место хранения и скорость это напрямую не влияет."}
            ]},

        io:{icon:"⌨️",name:"Ввод и вывод",q:[
                {q:"Что нужно передавать в scanf для чтения int?",a:["Значение переменной","Адрес переменной через &","Указатель на указатель","Имя переменной в кавычках"],correct:[1],
                    exp:"<code>scanf</code> должна <b>записать</b> значение в переменную, а для этого ей нужен адрес: <code>scanf(\"%d\", &x)</code>. Без <code>&</code> функция получит копию значения и запишет данные по случайному адресу — программа упадёт."},
                {q:"Что возвращает scanf?",a:["Прочитанное значение","Количество успешно присвоенных значений","0 при успехе","Всегда 1"],correct:[1],
                    exp:"Возвращается <b>число успешно прочитанных элементов</b>. Для <code>scanf(\"%d %d\", &a, &b)</code> при полном успехе вернётся 2. Это стандартный способ проверить корректность ввода: <code>if (scanf(\"%d\", &x) != 1) ...</code>"},
                {q:"Как вывести число 42 с ведущими нулями в поле ширины 5?",a:['printf("%5d", 42)','printf("%05d", 42)','printf("%d5", 42)','printf("%.5d", 42)'],correct:[1],
                    exp:"Флаг <code>0</code> перед шириной заполняет пустое место нулями: <code>%05d</code> даст <code>00042</code>. Без нуля (<code>%5d</code>) будут пробелы: <code>&nbsp;&nbsp;&nbsp;42</code>."},
                {q:"Какой спецификатор используется для double в printf?",a:["%d","%f","%lf","%s"],correct:[1,2],
                    exp:"В <code>printf</code> работают оба: <code>float</code> при передаче автоматически повышается до <code>double</code>. В <b>scanf</b> разница критична — там <code>%f</code> для <code>float</code>, а <code>%lf</code> для <code>double</code>."},
                {q:'Что делает printf("%.2f", 3.14159)?',a:["Выведет 3.14159","Выведет 3.14","Выведет 3","Ошибка"],correct:[1],
                    exp:"<code>.2</code> задаёт <b>точность</b> — количество знаков после запятой. Число округляется до 3.14. Обрати внимание: <code>%.0f</code> от 0.0 даст <code>0</code>, а <code>%.2f</code> даст <code>0.00</code>."},
                {q:"Как вывести символ обратного слеша?",a:['printf("\\\\\\\\")','printf("\\\\")','printf("/")','putchar(92)'],correct:[0,3],
                    exp:"Обратный слеш — служебный символ, его нужно <b>экранировать</b>: два слеша в коде дают один на экране. Вариант с <code>putchar(92)</code> работает, потому что 92 — это ASCII-код слеша."},
                {q:'Чем getchar() отличается от scanf("%c")?',a:["Ничем","getchar читает один символ, не пропуская пробелы","getchar читает строку","scanf быстрее"],correct:[1],
                    exp:"Оба читают один символ, но <code>getchar()</code> проще и не требует форматной строки. Главное отличие от <code>%d</code> или <code>%s</code>: <b>пробелы и переводы строк не пропускаются</b> — это важно для задач на посимвольную обработку."},
                {q:"Почему результат getchar() сохраняют в int, а не в char?",a:["Так быстрее","Чтобы корректно отличить символ от EOF","char не может хранить символы","Это требование стандарта"],correct:[1],
                    exp:"<code>EOF</code> — это специальное значение (обычно −1), которое <b>не помещается</b> в диапазон обычных символов. Если сохранить результат в <code>char</code>, EOF может совпасть с реальным символом, и цикл чтения сломается."},
                {q:'Что останется в буфере после scanf("%d", &x)?',a:["Ничего","Символ перевода строки","Пробел","Вся строка"],correct:[1],
                    exp:"<code>%d</code> читает только цифры и останавливается на первом нецифровом символе — обычно это <code>\\n</code> от нажатия Enter. Он <b>остаётся в буфере</b>, и следующий <code>fgets</code> или <code>getchar</code> прочитает именно его."},
                {q:"Как правильно вывести кавычку внутри строки?",a:['printf("\\\\"")',"printf(\"'\")",'printf("\\\'")','putchar(34)'],correct:[0,3],
                    exp:"Двойная кавычка закрывает строковый литерал, поэтому её нужно <b>экранировать</b>: <code>\\\"</code>. Код 34 в ASCII — это как раз двойная кавычка. Одинарная кавычка внутри строки экранирования не требует."},
                {q:'Что делает fgets по сравнению со scanf("%s")?',a:["Читает строку целиком, включая пробелы","Читает только одно слово","Не добавляет \\0","Ограничивает длину чтения"],correct:[0,3],
                    exp:"<code>fgets</code> читает <b>до перевода строки</b>, сохраняя пробелы, и принимает размер буфера — это защищает от переполнения. <code>scanf(\"%s\")</code> останавливается на первом пробеле и не знает границ массива."},
                {q:"Какой спецификатор для вывода long long?",a:["%d","%ld","%lld","%llf"],correct:[2],
                    exp:"Каждая <code>l</code> добавляет «длины»: <code>%d</code> для <code>int</code>, <code>%ld</code> для <code>long</code>, <code>%lld</code> для <code>long long</code>. Неверный спецификатор — это <b>неопределённое поведение</b>, вывод будет мусорным."}
            ]},

        expr:{icon:"🧮",name:"Выражения",q:[
                {q:"Что означает оператор && в C?",a:["Побитовое И","Логическое И","Адрес переменной","Конкатенация"],correct:[1],
                    exp:"<code>&&</code> — <b>логическое И</b>: истинно, только если оба операнда истинны. Один амперсанд <code>&</code> — это побитовое И (работает с битами) или взятие адреса (унарная форма)."},
                {q:"Что такое короткое замыкание при вычислении a && b?",a:["Если a ложно, b не вычисляется","Оба операнда всегда вычисляются","Компилятор оптимизирует код","Результат всегда 1"],correct:[0],
                    exp:"Если левая часть <code>&&</code> ложна, результат уже известен — правая <b>не вычисляется</b>. Это позволяет писать безопасные проверки: <code>if (p != NULL && p->x > 0)</code> — разыменование не произойдёт при <code>NULL</code>."},
                {q:"Чему равно выражение !0 в C?",a:["0","1","-1","Ошибка"],correct:[1],
                    exp:"В C <b>ноль — это ложь</b>, любое другое число — истина. Оператор <code>!</code> инвертирует: <code>!0</code> даёт 1, а <code>!5</code> даёт 0. Логические операторы всегда возвращают ровно 0 или 1."},
                {q:"Как получить последнюю цифру числа n?",a:["n / 10","n % 10","n - 10","n >> 1"],correct:[1],
                    exp:"Остаток от деления на 10 — это и есть <b>последняя цифра</b>: для 123 получим 3. А <code>n / 10</code> наоборот <i>убирает</i> последнюю цифру (123 → 12)."},
                {q:"Как убрать последнюю цифру числа n?",a:["n % 10","n / 10","n - n % 10","n >> 10"],correct:[1],
                    exp:"Целочисленное деление на 10 <b>отбрасывает</b> последний разряд: 123 / 10 = 12. Вариант C (<code>n - n % 10</code>) обнулит последнюю цифру, но не сдвинет число: получится 120, а не 12."},
                {q:"Что вернёт выражение (5 > 3)?",a:["true","1","0","Ошибка"],correct:[1],
                    exp:"В классическом C нет типа <code>bool</code> без <code>&lt;stdbool.h&gt;</code>. Операторы сравнения возвращают <b>int</b>: 1 при истине, 0 при лжи."},
                {q:"Почему нельзя писать 0 <= x <= 9?",a:["Это синтаксическая ошибка","Сначала вычислится (0<=x), результат 0 или 1 сравнится с 9","Так можно","Компилятор выдаст предупреждение"],correct:[1],
                    exp:"Операторы вычисляются <b>слева направо по одному</b>. Сначала <code>0 &lt;= x</code> даёт 0 или 1, затем это сравнивается с 9 — и всегда истинно. Правильно: <code>x &gt;= 0 && x &lt;= 9</code>."},
                {q:"Что делает оператор ^ применительно к целым числам?",a:["Возведение в степень","Побитовое исключающее ИЛИ","Логическое ИЛИ","Инверсия битов"],correct:[1],
                    exp:"<code>^</code> — это <b>XOR</b>: бит результата равен 1, если биты операндов различаются. Для возведения в степень используется <code>pow()</code> из <code>&lt;math.h&gt;</code>. Инверсия — это <code>~</code>."},
                {q:"Чему равно x ^ x для любого целого x?",a:["x","0","1","-x"],correct:[1],
                    exp:"Каждый бит XOR с самим собой даёт 0. Это свойство используется в задаче «число без пары»: если применить XOR ко всем элементам, <b>парные взаимно уничтожатся</b>, останется непарное."},
                {q:"Как правильно привести int к double при делении?",a:["(double)a / b","a / (double)b","(double)(a / b)","double(a) / b"],correct:[0,1],
                    exp:"Достаточно привести <b>один</b> операнд — второй повысится автоматически. Вариант C бесполезен: деление уже произошло в целых числах. Вариант D — синтаксис C++, в C так нельзя."},
                {q:"Какие математические функции требуют подключения <math.h>?",a:["round","sqrt","pow","abs для int"],correct:[0,1,2],
                    exp:"<code>round</code>, <code>sqrt</code> и <code>pow</code> объявлены в <code>&lt;math.h&gt;</code> и часто требуют флага <code>-lm</code> при сборке. А <code>abs</code> для целых лежит в <code>&lt;stdlib.h&gt;</code>."},
                {q:"Что означает тернарный оператор a ? b : c?",a:["Если a истинно — результат b, иначе c","Всегда возвращает b","Это цикл","Сравнивает три значения"],correct:[0],
                    exp:"Это <b>краткая форма if-else</b>, но в виде выражения: <code>int max = (x &gt; y) ? x : y;</code>. Полезно там, где нужен именно результат, а не оператор."}
            ]},

        loops:{icon:"🔁",name:"Циклы",q:[
                {q:"Чем while отличается от do-while?",a:["Ничем","do-while выполнится минимум один раз","while быстрее","do-while не поддерживается в C"],correct:[1],
                    exp:"<code>while</code> проверяет условие <b>до</b> тела, поэтому может не выполниться ни разу. <code>do-while</code> проверяет <b>после</b>, значит тело гарантированно выполнится хотя бы однажды."},
                {q:"Что делает оператор break внутри цикла?",a:["Завершает всю программу","Выходит из ближайшего цикла","Пропускает итерацию","Возвращает значение"],correct:[1],
                    exp:"<code>break</code> прерывает <b>только ближайший</b> охватывающий цикл или <code>switch</code>. Из вложенных циклов он выведет лишь из внутреннего. Для выхода из функции нужен <code>return</code>."},
                {q:"Что делает continue?",a:["Выходит из цикла","Переходит к следующей итерации","Перезапускает цикл","Останавливает программу"],correct:[1],
                    exp:"<code>continue</code> <b>пропускает остаток тела</b> и переходит к следующей итерации. В <code>for</code> при этом выполняется шаг (<code>i++</code>), а в <code>while</code> — сразу проверка условия."},
                {q:"Сколько раз выполнится for(int i=0; i<5; i++)?",a:["4","5","6","Бесконечно"],correct:[1],
                    exp:"Значения <code>i</code>: 0, 1, 2, 3, 4 — это <b>5 итераций</b>. При <code>i == 5</code> условие <code>i &lt; 5</code> становится ложным. Классическая конструкция для перебора массива из 5 элементов."},
                {q:"Как читать числа до маркера -1?",a:['while(scanf("%d",&x)==1 && x!=-1)',"for(int i=0;i<-1;i++)","while(x != -1) без чтения","do{}while(x)"],correct:[0],
                    exp:"Условие делает <b>две проверки сразу</b>: чтение прошло успешно и число не равно маркеру. Сам <code>-1</code> в тело цикла не попадёт, поэтому не будет обработан как элемент."},
                {q:'Почему важен порядок в условии scanf(...) == 1 && x != -1?',a:["Не важен","Сначала нужно проверить успех чтения, иначе x содержит мусор","Компилятор требует","Так короче"],correct:[1],
                    exp:"Благодаря <b>короткому замыканию</b> правая часть не вычисляется, если левая ложна. Если поменять местами, при неудачном чтении программа сравнит неинициализированную переменную — это неопределённое поведение."},
                {q:"Как найти максимум в последовательности без массива?",a:["Хранить текущий максимум и сравнивать с новым","Нужен массив обязательно","Отсортировать данные","Использовать рекурсию"],correct:[0],
                    exp:"Достаточно <b>одной переменной</b>: каждый новый элемент сравниваем с текущим максимумом и обновляем при необходимости. Это работает за один проход и с постоянной памятью."},
                {q:"Что произойдёт при for(int i=0; i<5; i--)?",a:["Цикл выполнится 5 раз","Бесконечный цикл","Ошибка компиляции","Цикл не выполнится"],correct:[1],
                    exp:"<code>i</code> уменьшается, поэтому условие <code>i &lt; 5</code> <b>всегда истинно</b>. Формально при переполнении <code>int</code> возникнет неопределённое поведение, но на практике это зацикливание."},
                {q:"Какие циклы есть в C?",a:["for","while","do-while","foreach"],correct:[0,1,2],
                    exp:"В C ровно <b>три</b> вида циклов. <code>foreach</code> есть в C#, PHP, Java (в виде <code>for-each</code>), но не в C — здесь для перебора массива используют обычный <code>for</code> с индексом."},
                {q:"Как перебрать все цифры числа?",a:["while(n > 0) { d = n % 10; n /= 10; }","for(int i=0;i<n;i++)","Через массив","Только рекурсией"],correct:[0],
                    exp:"На каждом шаге берём <b>последнюю цифру</b> через остаток и <b>отбрасываем</b> её делением. Цикл идёт справа налево и заканчивается, когда число обнулится."},
                {q:"Что вернёт цикл while(n > 0) для n = 0?",a:["Выполнится один раз","Не выполнится ни разу","Бесконечный цикл","Ошибка"],correct:[1],
                    exp:"Условие проверяется <b>до</b> первой итерации и сразу ложно. Это типичная ловушка в задачах на цифры: для числа 0 нужно обрабатывать случай отдельно, иначе программа ничего не выведет."},
                {q:"Как работает вложенный цикл?",a:["Внутренний полностью проходит на каждой итерации внешнего","Оба цикла идут параллельно","Внешний выполняется один раз","Это запрещено"],correct:[0],
                    exp:"На <b>каждом</b> шаге внешнего цикла внутренний прокручивается целиком с начала. Для матрицы 3×4 это даёт 3 × 4 = 12 итераций тела."}
            ]},

        arrays:{icon:"📦",name:"Динамические массивы",q:[
                {q:"Какая функция выделяет память динамически?",a:["malloc","alloc","new","create"],correct:[0],
                    exp:"<code>malloc</code> из <code>&lt;stdlib.h&gt;</code> выделяет блок нужного размера и возвращает указатель на него. <code>new</code> — это C++, а <code>alloc</code> и <code>create</code> в стандарте C отсутствуют."},
                {q:"Что возвращает malloc при нехватке памяти?",a:["0","NULL","-1","Выбрасывает исключение"],correct:[1],
                    exp:"При неудаче возвращается <b>NULL</b>. В C нет исключений, поэтому результат нужно проверять вручную: <code>if (p == NULL) { ... }</code>. Обращение по нулевому указателю приведёт к падению программы."},
                {q:"Чем calloc отличается от malloc?",a:["calloc быстрее","calloc обнуляет выделенную память","calloc не требует free","Ничем"],correct:[1],
                    exp:"<code>calloc(n, size)</code> принимает два аргумента и <b>заполняет память нулями</b>. <code>malloc</code> оставляет мусор от предыдущего использования. Освобождать нужно обе одинаково — через <code>free</code>."},
                {q:"Что произойдёт, если не вызвать free?",a:["Ничего","Утечка памяти","Программа упадёт","Компилятор выдаст ошибку"],correct:[1],
                    exp:"Выделенный блок останется <b>занятым</b> до завершения программы. В коротких задачах это не критично, но Valgrind это заметит, а в долгоживущих программах память будет расти бесконечно."},
                {q:"Как правильно выделить массив из n элементов int?",a:["malloc(n)","malloc(n * sizeof(int))","malloc(sizeof(int))","calloc(n, sizeof(int))"],correct:[1,3],
                    exp:"Нужно умножить количество на <b>размер одного элемента</b>. <code>malloc(n)</code> выделит всего n байт вместо n × 4. Часто пишут <code>sizeof(*p)</code> — тогда при смене типа указателя код не сломается."},
                {q:"Что делает realloc?",a:["Освобождает память","Изменяет размер выделенного блока","Копирует массив","Обнуляет память"],correct:[1],
                    exp:"<code>realloc</code> меняет размер блока, по возможности <b>сохраняя данные</b>. Если расширить на месте нельзя, функция выделит новый участок, скопирует содержимое и освободит старый."},
                {q:"Почему опасно писать a = realloc(a, size)?",a:["Это медленно","При неудаче потеряется старый указатель — утечка","Realloc так не работает","Ничего опасного"],correct:[1],
                    exp:"Если <code>realloc</code> вернёт <code>NULL</code>, в <code>a</code> запишется ноль, а <b>старый блок останется висеть</b> в памяти без ссылки. Правильно: сохранить результат во временный указатель и проверить его."},
                {q:"Какие функции требуют подключения <stdlib.h>?",a:["malloc","free","calloc","realloc"],correct:[0,1,2,3],
                    exp:"Все функции управления динамической памятью объявлены в <code>&lt;stdlib.h&gt;</code>. Без этого заголовка компилятор с <code>-Wall -Werror</code> выдаст ошибку о неявном объявлении."},
                {q:"Что означает обращение к массиву после free?",a:["Вернётся ноль","Неопределённое поведение","Данные сохраняются","Ошибка компиляции"],correct:[1],
                    exp:"Память возвращена системе и может быть <b>переиспользована</b>. Иногда данные ещё видны, иногда программа падает — поведение непредсказуемо. Такой указатель называют «висячим»."},
                {q:"Как обратиться к i-му элементу через указатель p?",a:["p[i]","*(p + i)","p + i","&p[i]"],correct:[0,1],
                    exp:"<code>p[i]</code> — это просто <b>синтаксический сахар</b> для <code>*(p + i)</code>. Варианты C и D дают адрес элемента, а не его значение."},
                {q:"Сколько байт займёт массив из 10 int (при sizeof(int)==4)?",a:["10","40","4","80"],correct:[1],
                    exp:"10 элементов × 4 байта = <b>40 байт</b>. Именно столько нужно запросить у <code>malloc</code>: <code>malloc(10 * sizeof(int))</code>."},
                {q:"Зачем присваивать указателю NULL после free?",a:["Это обязательно по стандарту","Чтобы избежать обращения по висячему указателю","Освобождает больше памяти","Ускоряет программу"],correct:[1],
                    exp:"После <code>free</code> указатель хранит <b>старый адрес</b>, но пользоваться им нельзя. Обнуление делает проблему явной: обращение по <code>NULL</code> сразу упадёт, а не испортит чужие данные."}
            ]},

        strings:{icon:"📝",name:"Строки",q:[
                {q:"Чем заканчивается строка в C?",a:["Символом \\n","Нулевым символом \\0","Пробелом","Ничем"],correct:[1],
                    exp:"<b>Нулевой символ</b> <code>'\\0'</code> (код 0) — единственный признак конца строки. Именно по нему <code>printf(\"%s\")</code> и <code>strlen</code> понимают, где остановиться. Не путать с символом <code>'0'</code> (код 48)."},
                {q:"Какой размер массива нужен для строки из 10 символов?",a:["10","11","12","9"],correct:[1],
                    exp:"10 символов текста + <b>1 байт под <code>'\\0'</code></b> = 11. Частая ошибка — забыть про терминатор: тогда строковые функции выйдут за границу массива."},
                {q:"Что делает strlen?",a:["Возвращает размер массива","Возвращает длину строки без \\0","Включает \\0 в длину","Копирует строку"],correct:[1],
                    exp:"<code>strlen</code> считает символы <b>до</b> нулевого терминатора, не включая его. Для <code>\"cat\"</code> вернёт 3, хотя в памяти занято 4 байта. Размер массива она не знает."},
                {q:"Почему нельзя сравнивать строки через ==?",a:["Можно","Сравниваются адреса, а не содержимое","Это синтаксическая ошибка","Работает только для коротких строк"],correct:[1],
                    exp:"Имя массива превращается в <b>указатель</b>, поэтому <code>==</code> сравнит адреса в памяти. Для сравнения содержимого нужен <code>strcmp</code> или посимвольный обход в цикле."},
                {q:"Что возвращает strcmp(a, b), если a идёт раньше b в алфавите?",a:["Положительное число","Отрицательное число","0","1"],correct:[1],
                    exp:"<code>strcmp</code> возвращает <b>разность кодов</b> первых различающихся символов. Если <code>a</code> «меньше» — результат отрицательный, если «больше» — положительный, при равенстве — 0. Конкретное число не гарантировано, проверять надо знак."},
                {q:"Как проверить, что символ является цифрой, без <ctype.h>?",a:["ch >= '0' && ch <= '9'","ch >= 0 && ch <= 9","isdigit(ch)","ch == '0'"],correct:[0],
                    exp:"Цифры в ASCII идут <b>подряд</b> от <code>'0'</code> (48) до <code>'9'</code> (57), поэтому достаточно проверить диапазон. Вариант B сравнивает с числами 0 и 9 — это управляющие символы, а не цифры."},
                {q:"Как перевести заглавную латинскую букву в строчную вручную?",a:["ch + 32","ch - 'A' + 'a'","ch - 32","tolower(ch)"],correct:[0,1],
                    exp:"В ASCII строчные буквы стоят <b>ровно на 32 позиции дальше</b> заглавных ('A'=65, 'a'=97). Запись <code>ch - 'A' + 'a'</code> предпочтительнее: она понятнее и не зависит от знания конкретного числа."},
                {q:"Какая функция копирует строку с выделением памяти?",a:["strcpy","strdup","memcpy","strcat"],correct:[1],
                    exp:"<code>strdup</code> сама вызывает <code>malloc</code> нужного размера и копирует туда строку — результат потом надо освободить через <code>free</code>. <code>strcpy</code> требует, чтобы буфер <b>уже был выделен</b>."},
                {q:"Почему gets() нельзя использовать?",a:["Она медленная","Удалена из стандарта C11, небезопасна","Не читает пробелы","Требует <stdlib.h>"],correct:[1],
                    exp:"<code>gets</code> не знает <b>размер буфера</b> и пишет столько, сколько введёт пользователь — классическая уязвимость переполнения. В C11 её удалили окончательно; вместо неё используют <code>fgets</code>."},
                {q:"Что оставляет fgets в конце прочитанной строки?",a:["Только \\0","Символ \\n, если он поместился, и \\0","Пробел","Ничего"],correct:[1],
                    exp:"<code>fgets</code> <b>сохраняет перевод строки</b> как часть данных. Обычно его убирают вручную: найти <code>'\\n'</code> и заменить на <code>'\\0'</code>, иначе он попадёт в сравнение или вывод."},
                {q:"Какие утверждения о строках в C верны?",a:["Строка — массив символов","Можно обращаться к отдельным символам по индексу","Нет защиты от выхода за границы","Строка — это объект"],correct:[0,1,2],
                    exp:"В C строка — это просто <b>массив <code>char</code></b> с терминатором. Никакого класса или объекта нет, границы никто не проверяет — ответственность полностью на программисте."},
                {q:"Как правильно прочитать строку с пробелами?",a:['scanf("%s", str)',"fgets(str, size, stdin)","getchar() в цикле","gets(str)"],correct:[1,2],
                    exp:"<code>fgets</code> и посимвольное чтение через <code>getchar</code> <b>сохраняют пробелы</b>. <code>scanf(\"%s\")</code> останавливается на первом пробельном символе, а <code>gets</code> удалена из стандарта."}
            ]},

        matrices:{icon:"🔢",name:"Матрицы",q:[
                {q:"Как объявить статическую матрицу 3×4 типа int?",a:["int m[3][4];","int m[4][3];","int m[12];","int **m;"],correct:[0],
                    exp:"Первый индекс — <b>количество строк</b>, второй — столбцов. <code>int m[12]</code> — это одномерный массив (хотя элементов столько же), а <code>int **m</code> — указатель, память под него ещё надо выделить."},
                {q:"Что означает m[i][j]?",a:["Элемент в строке i, столбце j","Элемент в столбце i, строке j","i-й элемент массива j","Указатель на строку"],correct:[0],
                    exp:"Порядок индексов — <b>сначала строка, потом столбец</b>. Запись <code>m[i]</code> сама по себе даёт i-ю строку целиком (указатель на её начало)."},
                {q:"Какие способы представления матрицы в памяти существуют?",a:["Двумерный массив","Массив указателей на строки","Массив указателей на столбцы","Связанный список"],correct:[0,1,2],
                    exp:"Классические варианты — статический двумерный массив и массив указателей (чаще на строки, но можно и на столбцы). Связанный список для матриц <b>не используют</b>: он не даёт доступа по индексу за O(1)."},
                {q:"Как вычисляется элемент при умножении матриц C = A × B?",a:["C[i][j] = A[i][j] * B[i][j]","C[i][j] = сумма A[i][k] * B[k][j]","C[i][j] = A[j][i] * B[i][j]","C[i][j] = A[i][j] + B[i][j]"],correct:[1],
                    exp:"Элемент результата — это <b>скалярное произведение</b> i-й строки первой матрицы на j-й столбец второй. Поэтому нужен третий цикл по k и три вложенных цикла в сумме."},
                {q:"Как вычисляется элемент при сложении матриц?",a:["C[i][j] = A[i][j] + B[i][j]","Через тройной цикл","C[i][j] = сумма строк","Матрицы нельзя складывать"],correct:[0],
                    exp:"Сложение <b>поэлементное</b> — достаточно двух циклов. Матрицы должны иметь одинаковые размеры. Это заметно проще умножения, где нужен дополнительный проход."},
                {q:"Что получится при повороте матрицы M×N на 90° по часовой стрелке?",a:["Матрица M×N","Матрица N×M","Матрица квадратная","Размер не меняется"],correct:[1],
                    exp:"Строки становятся столбцами, поэтому <b>размеры меняются местами</b>: матрица 2×3 превратится в 3×2. Элемент <code>a[i][j]</code> попадёт в позицию <code>b[j][M-1-i]</code>."},
                {q:"Сколько вложенных циклов нужно для умножения квадратных матриц?",a:["1","2","3","4"],correct:[2],
                    exp:"Два внешних цикла перебирают позицию результата (i и j), третий накапливает <b>сумму произведений</b> по k. Сложность получается O(n³)."},
                {q:"Как выделить динамическую матрицу как массив указателей?",a:["Выделить массив указателей, затем каждую строку отдельно","malloc(rows * cols)","Нельзя выделить динамически","Только статически"],correct:[0],
                    exp:"Сначала <code>malloc</code> под массив из <code>rows</code> указателей, затем в цикле — под каждую строку. Получается <b>двухуровневая структура</b>, к которой можно обращаться как <code>m[i][j]</code>."},
                {q:"Как правильно освободить матрицу, выделенную как массив указателей?",a:["Один free(m)","Сначала free каждой строки, потом free(m)","Сначала free(m), потом строки","Освобождение не нужно"],correct:[1],
                    exp:"Порядок <b>строго обратный</b> выделению. Если освободить <code>m</code> первым, адреса строк потеряются и они утекут. Один <code>free(m)</code> освободит только массив указателей."},
                {q:"Как обойти матрицу по строкам?",a:["Внешний цикл по i, внутренний по j","Внешний по j, внутренний по i","Один цикл до M*N","Рекурсивно"],correct:[0],
                    exp:"Внешний цикл фиксирует строку, внутренний пробегает её элементы — так вывод получается <b>построчным</b>. Обратный порядок даст обход по столбцам."},
                {q:"Что значит транспонировать матрицу?",a:["Поменять строки и столбцы местами","Повернуть на 90°","Отразить по горизонтали","Умножить на единичную"],correct:[0],
                    exp:"Транспонирование — это <code>b[j][i] = a[i][j]</code>, отражение относительно <b>главной диагонали</b>. Поворот на 90° = транспонирование плюс отражение, это разные операции."},
                {q:"Как обеспечить отсутствие пробела в конце строки матрицы?",a:["Печатать пробел перед элементом, кроме первого","Всегда печатать пробел после","Использовать \\t","Обрезать строку"],correct:[0],
                    exp:"Приём тот же, что и для вывода списков: разделитель ставится <b>перед</b> элементом при условии <code>j &gt; 0</code>. Тогда после последнего элемента ничего лишнего не останется."}
            ]},

        structs:{icon:"🏗",name:"Структуры",q:[
                {q:"Как обратиться к полю структуры через переменную?",a:["s.field","s->field","s::field","*s.field"],correct:[0],
                    exp:"Точка используется, когда у нас <b>сама структура</b>. Стрелка <code>-&gt;</code> — когда указатель на неё. <code>::</code> — это C++."},
                {q:"Как обратиться к полю структуры через указатель?",a:["p.field","p->field","(*p).field","*p.field"],correct:[1,2],
                    exp:"<code>p-&gt;field</code> — это <b>сокращение</b> для <code>(*p).field</code>. Скобки в развёрнутой форме обязательны: без них точка сработает раньше разыменования."},
                {q:"Можно ли копировать структуры присваиванием?",a:["Нет, только memcpy","Да, все поля копируются автоматически","Только через цикл","Только простые структуры"],correct:[1],
                    exp:"Присваивание структур <b>разрешено</b> и копирует все поля побайтово. Но если внутри есть указатель, скопируется сам адрес — оба экземпляра будут ссылаться на одни данные (поверхностное копирование)."},
                {q:"Можно ли сравнивать структуры через ==?",a:["Да, всегда","Нет, нужно сравнивать поля по отдельности","Только маленькие структуры","Да, если нет указателей"],correct:[1],
                    exp:"Оператор <code>==</code> для структур <b>не определён</b> — это ошибка компиляции. Причина в выравнивании: между полями могут быть «дыры» с мусором, и побайтовое сравнение было бы ненадёжным."},
                {q:"Какие операции применимы к структурам?",a:["Доступ через .","Доступ через ->","Копирование присваиванием","Прямое сравнение =="],correct:[0,1,2],
                    exp:"Доступ к полям и копирование работают, а вот <b>сравнение через <code>==</code> запрещено</b>. Арифметика со структурами тоже недоступна."},
                {q:"Как выделить память под массив структур?",a:["malloc(n * sizeof(struct name))","malloc(n)","malloc(sizeof(struct name))","Только статически"],correct:[0],
                    exp:"Принцип тот же, что и для обычных массивов: <b>количество × размер элемента</b>. Часто пишут <code>sizeof(*ptr)</code> — так короче и безопаснее при смене типа."},
                {q:"Верные утверждения о структурах в C?",a:["Память можно выделять статически и динамически","Поля могут быть разных типов","Нужно всегда выделять динамически","Структуры нельзя передавать в функции"],correct:[0,1],
                    exp:"Структуру можно объявить как обычную переменную <b>или</b> выделить через <code>malloc</code>. Поля могут быть любых типов, включая другие структуры. Передавать в функции можно и по значению, и по указателю."},
                {q:"Что делает typedef struct {...} Name;?",a:["Создаёт псевдоним типа","Создаёт переменную","Выделяет память","Объявляет функцию"],correct:[0],
                    exp:"<code>typedef</code> позволяет писать <code>Name s;</code> вместо <code>struct Name s;</code>. Это <b>только удобство именования</b> — никакой памяти не выделяется."},
                {q:"Как передать структуру в функцию без копирования?",a:["По значению","По указателю","Через глобальную переменную","Это невозможно"],correct:[1],
                    exp:"Передача <b>по указателю</b> копирует только адрес (обычно 8 байт) вместо всей структуры. Это быстрее для больших структур и позволяет функции изменять оригинал."},
                {q:"Что такое устойчивая сортировка?",a:["Быстрая сортировка","Сохраняет относительный порядок равных элементов","Не использует дополнительную память","Работает за O(n)"],correct:[1],
                    exp:"Если два элемента <b>равны по ключу</b>, устойчивая сортировка оставит их в исходном порядке. В пузырьковой сортировке это достигается строгим сравнением (<code>&lt;</code> вместо <code>&lt;=</code>)."},
                {q:"Как поменять местами две структуры?",a:["Через временную переменную того же типа","Только поэлементно","swap(a, b)","Это невозможно"],correct:[0],
                    exp:"Поскольку присваивание структур работает, обмен делается <b>классическим способом</b>: <code>tmp = a; a = b; b = tmp;</code>. Встроенной функции <code>swap</code> в C нет."},
                {q:"Какая сложность у пузырьковой сортировки?",a:["O(n)","O(n log n)","O(n²)","O(1)"],correct:[2],
                    exp:"Два вложенных цикла дают примерно n²/2 сравнений — это <b>O(n²)</b>. Для малых массивов (до сотни элементов) этого достаточно, для больших нужны <code>qsort</code> или другие алгоритмы."}
            ]},

        widum:{icon:"🎓",name:"Экзаменационные",note:"Возможно, будут на экзамене",src:true,q:[
                {q:"Какие типы файлов существуют?",a:["Универсальные","Блочные","Бинарные","Текстовые"],correct:[1,2,3],
                    exp:"В C файлы делятся на <b>текстовые и бинарные</b> по способу интерпретации данных. В Unix-системах отдельно выделяют <b>блочные</b> устройства (диски) наряду с символьными. «Универсальных» файлов не бывает."},
                {q:"Что такое строки в языке C?",a:["Строка — это объект","Источник ошибок, так как нет защиты при выходе за границы","Строка — это массив символов","Можно получить доступ к отдельным символам"],correct:[2,3],
                    exp:"Строка в C — это <b>массив <code>char</code></b> с завершающим <code>'\\0'</code>. Доступ по индексу есть, но никакой проверки границ нет. Объектов в C не существует — это концепция ООП-языков."},
                {q:"Какие аргументы у main()?",a:["main() не принимает аргументы","int argc, char *argv[]","char *argv[], int argc","int argc, char **argv"],correct:[1,3],
                    exp:"Стандартная сигнатура: <b>сначала счётчик, потом массив строк</b>. Записи <code>char *argv[]</code> и <code>char **argv</code> эквивалентны. Порядок параметров менять нельзя."},
                {q:"Что является принципом структурного программирования?",a:["Всё должно быть написано в одной функции","Следует использовать только глобальные переменные","Рекомендуется использовать классы","Программа должна быть разбита на отдельные блоки или функции"],correct:[3],
                    exp:"Ключевая идея — <b>декомпозиция</b>: разбиение задачи на небольшие независимые блоки. Классы относятся к ООП, а монолитный код и глобальные переменные — наоборот, антипаттерны."},
                {q:"Каким режимом открыть файл для дозаписи в конец?",a:["w+","r","w","a"],correct:[3],
                    exp:"<code>a</code> (append) добавляет данные <b>в конец</b>, сохраняя существующее содержимое. Режимы <code>w</code> и <code>w+</code> обрезают файл до нуля, а <code>r</code> открывает только для чтения."},
                {q:"Как вернуть код ошибки и значение функции?",a:["Функция может возвращать два значения","Использовать исключения","Через глобальную переменную","Возврат кода ошибки, значение — через указатель"],correct:[3],
                    exp:"Стандартный приём в C: функция возвращает <b>статус</b>, а результат записывает по переданному указателю. Исключений в C нет, а глобальные переменные ломают переиспользуемость кода."},
                {q:"Что такое структурное программирование?",a:["В нём используются классы","В нём используются структуры","В нём используются функции","В нём используется декомпозиция и 3 базовые конструкции"],correct:[2,3],
                    exp:"Три базовые конструкции — <b>последовательность, ветвление и цикл</b>. Задача разбивается на функции. Слово «структуры» здесь не про <code>struct</code>, а про структуру программы."},
                {q:"Что такое компиляция?",a:["Сжатие исходного кода","Проверка стиля и форматирования кода","Процесс преобразования исходного кода в исполняемый файл","Запуск программы на выполнение"],correct:[2],
                    exp:"Компиляция <b>переводит</b> текст программы в машинный код. Запуск — это отдельный шаг, происходящий уже после сборки. Проверка стиля выполняется линтерами вроде <code>clang-format</code>."},
                {q:"Как происходит обработка аргументов командной строки?",a:["Командная строка не поддерживается","Используется глобальный массив","Обрабатывается программистом с использованием argc и argv","Система автоматически разбирает аргументы"],correct:[2],
                    exp:"Система лишь <b>передаёт</b> аргументы в <code>main</code> как массив строк. Разбор флагов, преобразование в числа, проверка корректности — всё это пишет программист вручную."},
                {q:"Что такое SSH и где применяется?",a:["SSH — это протокол канального уровня","SSH применяется для передачи гипертекста","SSH (secure shell) — это сетевой протокол для защищённого управления удалёнными системами","SSH применяется для безопасной передачи данных"],correct:[2],
                    exp:"SSH работает на <b>прикладном уровне</b> и обеспечивает шифрованный доступ к удалённой машине. Гипертекст передаёт HTTP. В Школе 21 SSH нужен для работы с Git по ключам."},
                {q:"Какое имя файла является валидным?",a:["Любая последовательность букв, цифр и спец. символов","Любая последовательность символов, кроме «/» и «\\0»","Любая последовательность букв и цифр","Имя должно быть не длиннее 8 символов"],correct:[1],
                    exp:"В Unix запрещены ровно два символа: <b>слеш</b> (разделитель пути) и <b>нулевой байт</b> (конец строки). Ограничение в 8 символов — это устаревшее правило MS-DOS."},
                {q:"Основные компоненты Unix?",a:["Системные библиотеки","Системные утилиты","Графическая оболочка","Ядро"],correct:[0,1,3],
                    exp:"Классическая архитектура: <b>ядро</b> управляет ресурсами, <b>библиотеки</b> дают программам API, <b>утилиты</b> обеспечивают работу пользователя. Графическая оболочка — необязательная надстройка, серверы работают без неё."},
                {q:"Как хранятся строки в памяти в C?",a:["Хранятся в виде объекта","Хранятся в бинарном дереве","Хранятся как массив с последним символом «\\0»","Хранятся как структура данных"],correct:[2],
                    exp:"Символы лежат в памяти <b>подряд</b>, а признаком конца служит нулевой байт. Длина отдельно нигде не хранится — поэтому <code>strlen</code> каждый раз проходит по всей строке."},
                {q:"Что такое компоновщик?",a:["Переименовывает переменные","Удаляет ненужные части программы","Соединяет объектные файлы в единый исполняемый файл","Проверяет грамматику языка"],correct:[2],
                    exp:"Компоновщик (linker) работает <b>после компилятора</b>: связывает объектные файлы между собой и подключает библиотеки. Ошибка «undefined reference» приходит именно от него."},
                {q:"Что НЕ является принципом структурного программирования?",a:["Использование циклов","Использование функций","Использование глобальных переменных","Использование goto"],correct:[2,3],
                    exp:"<code>goto</code> создаёт «спагетти-код» и ломает линейную логику, а <b>глобальные переменные</b> делают зависимости неявными. Циклы и функции — наоборот, основа структурного подхода."},
                {q:"Как происходит обработка ошибок в C и нужно ли проверять выделение памяти?",a:["В C нет встроенной поддержки исключений","Нужно проверять результат malloc","malloc не всегда выделяет память","Ошибки обрабатываются автоматически"],correct:[0,1,2],
                    exp:"В C ошибки передаются через <b>возвращаемые значения</b> и <code>errno</code>. <code>malloc</code> может вернуть <code>NULL</code> при нехватке памяти, поэтому проверка обязательна. Ничего автоматического здесь нет."},
                {q:"Какие операции можно проводить над структурами?",a:["Можно обращаться с помощью операций . и ->","Можно прибавлять указатель к структуре","Можно сравнивать структуры напрямую","Можно копировать структуры присваиванием"],correct:[0,3],
                    exp:"Доступ к полям и копирование целиком <b>разрешены</b>. А вот сравнение через <code>==</code> компилятор не пропустит, и арифметика со структурами тоже недоступна."},
                {q:"В чём разница между git и GitLab?",a:["Git — это система управления версиями, а GitLab — веб-сервис для размещения репозиториев","Git и GitLab — одно и то же","GitLab — это клиент для Git","Git — это веб-интерфейс, а GitLab — язык программирования"],correct:[0],
                    exp:"<b>Git</b> — консольная программа для контроля версий, работает локально. <b>GitLab</b> — платформа, которая хранит репозитории на сервере и добавляет CI/CD, задачи и код-ревью."},
                {q:"Укажите верные утверждения о структурах в C",a:["В C для struct нужно динамически выделять память","Для struct можно выделять как статически, так и динамически память","Можно менять тип переменных","Структуры нельзя использовать в функциях"],correct:[1,2],
                    exp:"Структуру можно объявить <b>обычной переменной</b> (память на стеке) или выделить через <code>malloc</code> (куча). Поля описываются произвольными типами при объявлении структуры."},
                {q:"Что такое препроцессор в C?",a:["Выполняет замену макросов и вставку текстов перед компиляцией","Преобразует код в машинные инструкции","Запускает программу","Оптимизирует бинарный файл"],correct:[0],
                    exp:"Препроцессор работает <b>до компиляции</b> и обрабатывает директивы с <code>#</code>: подставляет <code>#include</code>, раскрывает <code>#define</code>, обрабатывает условную компиляцию. Это чисто текстовые преобразования."},
                {q:"Какая функция позволяет скопировать строку с выделением памяти под новую строку?",a:["memcpy","strcpy","strdup","strconcat"],correct:[2],
                    exp:"<code>strdup</code> = duplicate: выделяет память нужного размера <b>и</b> копирует строку. Результат обязательно освобождать через <code>free</code>. Функции <code>strconcat</code> в стандарте нет."},
                {q:'Что вернёт strcmp("adcb", "abc")?',a:["0","Положительное число","-1","1"],correct:[1],
                    exp:"Сравнение идёт посимвольно: 'a' = 'a', затем <b>'d' против 'b'</b>. Код 'd' (100) больше кода 'b' (98), поэтому результат положительный. Конкретное значение стандартом не задано."},
                {q:"Какие существуют способы представления матрицы в памяти?",a:["Двумерный массив","Связанный список","Массив указателей на столбцы","Массив указателей на строки"],correct:[0,2,3],
                    exp:"Все три варианта дают <b>доступ по индексу за O(1)</b>. Связанный список для матрицы неэффективен: чтобы добраться до элемента, придётся идти по цепочке."},
                {q:"Какие существуют функции для работы с памятью?",a:["realloc","free","calloc","malloc"],correct:[0,1,2,3],
                    exp:"Полный набор из <code>&lt;stdlib.h&gt;</code>: <code>malloc</code> выделяет, <code>calloc</code> выделяет с обнулением, <code>realloc</code> изменяет размер, <code>free</code> освобождает."}
            ]}

    };

    /* ============================================================
       THEME
       ============================================================ */
    const root = document.documentElement;
    const themeBtn = document.getElementById("themeBtn");

    function setTheme(t){
        root.setAttribute("data-theme", t);
        themeBtn.textContent = t === "dark" ? "🌙" : "☀️";
        try{ localStorage.setItem("quiz-theme", t); }catch(e){}
    }
    themeBtn.addEventListener("click", () => {
        setTheme(root.getAttribute("data-theme") === "dark" ? "light" : "dark");
    });
    (function(){
        let saved = null;
        try{ saved = localStorage.getItem("quiz-theme"); }catch(e){}
        if(!saved) saved = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        setTheme(saved);
    })();

    /* ============================================================
       HELPERS
       ============================================================ */
    const KEYS = ["A","B","C","D","E","F"];
    const $ = id => document.getElementById(id);
    const screens = { menu:$("menu"), quiz:$("quiz"), results:$("results") };
    let session = null;

    function show(name){
        for(const k in screens) screens[k].classList.toggle("hidden", k !== name);
        window.scrollTo({top:0,behavior:"instant"});
    }
    function shuffle(a){
        for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
        return a;
    }
    function plural(n,one,few,many){
        const m10=n%10,m100=n%100;
        if(m10===1&&m100!==11)return one;
        if(m10>=2&&m10<=4&&(m100<10||m100>=20))return few;
        return many;
    }
    function el(tag,cls,txt){
        const n=document.createElement(tag);
        if(cls)n.className=cls;
        if(txt!==undefined)n.textContent=txt;
        return n;
    }

    /* ============================================================
       MENU
       ============================================================ */
    function buildMenu(){
        const grid = $("topicGrid");
        grid.replaceChildren();
        for(const key in BANK){
            const t = BANK[key];
            const b = el("button","topic"+(t.src?" special":""));
            b.append(
                el("span","t-icon",t.icon),
                el("div","t-name",t.name),
                el("div","t-count",t.q.length+" "+plural(t.q.length,"вопрос","вопроса","вопросов"))
            );
            if(t.note) b.appendChild(el("div","t-note","⚠ "+t.note));
            b.addEventListener("click",()=>{
                const qs = t.q.map(q=>({...q,_topic:t.name,_src:!!t.src}));
                startQuiz(t.name, shuffle(qs));
            });
            grid.appendChild(b);
        }
    }

    $("rndStart").addEventListener("click",()=>{
        const want = Math.max(5,Math.min(150,parseInt($("rndCount").value)||20));
        const useW = $("rndWidum").checked;
        const pools = [];
        for(const key in BANK){
            if(key==="widum" && !useW) continue;
            pools.push(BANK[key].q.map(q=>({...q,_topic:BANK[key].name,_src:!!BANK[key].src})));
        }
        const per = Math.ceil(want/pools.length);
        let picked = [];
        pools.forEach(p=>{ picked = picked.concat(shuffle(p.slice()).slice(0,per)); });
        picked = shuffle(picked).slice(0,want);
        if(!picked.length){ alert("Нет доступных вопросов."); return; }
        startQuiz("🎲 Случайный набор", picked, true);
    });

    /* ============================================================
       QUIZ
       ============================================================ */
    function startQuiz(title, questions, showTopic){
        session = { title, questions, showTopic:!!showTopic, idx:0, ok:0, bad:0, log:[] };
        $("quizTitle").textContent = title;
        $("stack").replaceChildren();
        updateBar();
        show("quiz");
        addQuestionCard();
    }

    function updateBar(){
        const s = session;
        $("pillOk").textContent = "✓ "+s.ok;
        $("pillBad").textContent = "✗ "+s.bad;
        $("progFill").style.width = (s.idx/s.questions.length*100)+"%";
    }

    function addQuestionCard(){
        const s = session;
        const q = s.questions[s.idx];
        const multi = q.correct.length > 1;
        const num = s.idx;

        const card = el("div","card");
        card.dataset.idx = num;

        /* --- top tags --- */
        const top = el("div","q-top");
        top.appendChild(el("span","q-num",`Вопрос ${num+1} / ${s.questions.length}`));
        if(multi) top.appendChild(el("span","tag multi","Несколько ответов"));
        if(q._src) top.appendChild(el("span","tag src","widum.ru/s21/"));
        if(s.showTopic && q._topic && !q._src) top.appendChild(el("span","tag topic",q._topic));
        card.appendChild(top);

        card.appendChild(el("div","q-text",q.q));

        /* --- options --- */
        const opts = el("div","opts");
        const picked = [];
        const btns = [];

        q.a.forEach((text,i)=>{
            const b = el("button","opt");
            b.append(el("span","okey",KEYS[i]), el("span","otext",text), el("span","omark"));
            b.addEventListener("click",()=>{
                if(card.dataset.done) return;
                if(multi){
                    const p = picked.indexOf(i);
                    if(p===-1){ picked.push(i); b.classList.add("sel"); }
                    else { picked.splice(p,1); b.classList.remove("sel"); }
                    checkBtn.disabled = picked.length===0;
                } else {
                    picked.length = 0; picked.push(i);
                    reveal();
                }
            });
            btns.push(b);
            opts.appendChild(b);
        });
        card.appendChild(opts);

        /* --- check button (multi only) --- */
        const checkWrap = el("div","next-wrap");
        const checkBtn = el("button","primary next-btn","Проверить");
        checkBtn.disabled = true;
        checkBtn.addEventListener("click",reveal);
        if(multi){ checkWrap.appendChild(checkBtn); card.appendChild(checkWrap); }

        $("stack").appendChild(card);
        card.scrollIntoView({behavior:"smooth",block:"center"});

        /* --- reveal answer --- */
        function reveal(){
            if(card.dataset.done) return;
            card.dataset.done = "1";
            card.classList.add("done");
            checkWrap.remove();

            const right = q.correct.slice().sort().join(",");
            const mine  = picked.slice().sort().join(",");
            const isOk  = right === mine;

            btns.forEach((b,i)=>{
                b.disabled = true;
                b.classList.remove("sel");
                const mark = b.querySelector(".omark");
                if(q.correct.includes(i)){
                    if(picked.includes(i)){ b.classList.add("right"); mark.textContent="✓"; }
                    else { b.classList.add("miss"); mark.textContent="!"; }
                } else if(picked.includes(i)){
                    b.classList.add("bad"); mark.textContent="✗";
                }
            });

            if(isOk) s.ok++; else s.bad++;
            s.log.push({q:q.q, ok:isOk});

            /* explanation block */
            const exp = el("div","exp "+(isOk?"ok":"no"));
            exp.appendChild(el("div","exp-head", isOk ? "✓ Верно!" : "✗ Неверно"));

            const body = el("div","exp-body");
            const rl = el("div","exp-right");
            const rb = el("b"); rb.textContent = q.correct.length>1 ? "Правильные ответы: " : "Правильный ответ: ";
            rl.appendChild(rb);
            rl.appendChild(document.createTextNode(q.correct.map(i=>KEYS[i]+") "+q.a[i]).join("  ·  ")));
            body.appendChild(rl);

            const why = el("div","exp-why");
            why.innerHTML = q.exp;
            body.appendChild(why);

            exp.appendChild(body);
            card.appendChild(exp);

            /* next button */
            const nw = el("div","next-wrap");
            const isLast = s.idx === s.questions.length-1;
            const nb = el("button","primary next-btn", isLast ? "Показать результаты →" : "Следующий вопрос →");
            nb.addEventListener("click",()=>{
                nw.remove();
                s.idx++;
                updateBar();
                if(s.idx >= s.questions.length) showResults();
                else addQuestionCard();
            });
            nw.appendChild(nb);
            card.appendChild(nw);

            updateBar();
            setTimeout(()=>nb.scrollIntoView({behavior:"smooth",block:"center"}),120);
        }
    }

    $("quitBtn").addEventListener("click",()=>{
        if(session && session.idx>0 && !confirm("Выйти? Прогресс не сохранится.")) return;
        show("menu");
    });

    /* ============================================================
       RESULTS
       ============================================================ */
    function showResults(){
        const s = session;
        const total = s.questions.length;
        const pct = Math.round(s.ok/total*100);
        let emo,title,grade;
        if(pct===100){emo="🏆";title="Идеально!";grade="Все ответы верны. Так держать!";}
        else if(pct>=85){emo="🎉";title="Отлично!";grade="Тема освоена очень хорошо.";}
        else if(pct>=70){emo="👍";title="Хорошо";grade="Крепкий результат, но есть что подтянуть.";}
        else if(pct>=50){emo="📚";title="Неплохо";grade="Стоит повторить теорию и пройти ещё раз.";}
        else {emo="💪";title="Есть над чем поработать";grade="Загляни в theory.md и попробуй снова.";}

        $("resEmo").textContent = emo;
        $("resTitle").textContent = title;
        $("resGrade").textContent = grade;
        $("sOk").textContent = s.ok;
        $("sBad").textContent = s.bad;
        $("sPct").textContent = pct+"%";
        $("reviewBtn").classList.toggle("hidden", s.bad===0);
        show("results");
    }

    $("retryBtn").addEventListener("click",()=>{
        startQuiz(session.title, shuffle(session.questions.slice()), session.showTopic);
    });
    $("reviewBtn").addEventListener("click",()=>{
        screens.results.classList.add("hidden");
        screens.quiz.classList.remove("hidden");
        const first = document.querySelector(".card .exp.no");
        if(first) first.scrollIntoView({behavior:"smooth",block:"center"});
        else window.scrollTo({top:0,behavior:"smooth"});
    });
    $("menuBtn").addEventListener("click",()=>show("menu"));

    buildMenu();
</script>
</body>
</html>
